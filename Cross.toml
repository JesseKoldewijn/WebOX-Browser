# Cross.toml — configuration for `cross` (cross-compilation via Docker)
# https://github.com/cross-rs/cross/wiki/Configuration

[target.aarch64-unknown-linux-gnu.env]
# CEF_PATH is set in build.yml to $GITHUB_WORKSPACE/third_party/cef.
# cross remaps workspace paths to /project/ inside the Docker container,
# so inside Docker CEF_PATH becomes /project/third_party/cef.
passthrough = ["CEF_PATH"]

[target.aarch64-unknown-linux-gnu]
# Install ARM64 system libraries that libcef.so links against.
# These mirror the sys_deps used for the native linux-x64 build plus
# the additional libraries CEF requires (NSS, ALSA, dbus, ATK, GBM, xkbcommon).
# Note: shell line-continuation (\) is only valid inside TOML multi-line
# basic strings ("""); single-quoted strings reject embedded newlines.
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update -qq",
    """apt-get install -y --no-install-recommends \
        libgtk-3-dev:arm64 \
        libxcb-render0-dev:arm64 \
        libxcb-shape0-dev:arm64 \
        libxcb-xfixes0-dev:arm64 \
        libxkbcommon-dev:arm64 \
        libssl-dev:arm64 \
        pkg-config \
        libnss3-dev:arm64 \
        libasound2-dev:arm64 \
        libdbus-1-dev:arm64 \
        libatk1.0-dev:arm64 \
        libgbm-dev:arm64 \
        libx11-dev:arm64 \
        libxcomposite-dev:arm64 \
        libxdamage-dev:arm64 \
        libxext-dev:arm64 \
        libxfixes-dev:arm64 \
        libxrandr-dev:arm64 \
        libpango1.0-dev:arm64 \
        libcups2-dev:arm64""",
]
