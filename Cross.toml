# Cross.toml — configuration for `cross` (cross-compilation via Docker)
# https://github.com/cross-rs/cross/wiki/Configuration

[target.aarch64-unknown-linux-gnu]
# Install ARM64 system libraries that libcef.so links against.
# These mirror the sys_deps used for the native linux-x64 build plus
# the additional libraries CEF requires (NSS, ALSA, dbus, ATK, GBM, xkbcommon).
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update -qq",
    "apt-get install -y --no-install-recommends \
        libgtk-3-dev:arm64 \
        libxcb-render0-dev:arm64 \
        libxcb-shape0-dev:arm64 \
        libxcb-xfixes0-dev:arm64 \
        libxkbcommon-dev:arm64 \
        libssl-dev:arm64 \
        pkg-config \
        libnss3-dev:arm64 \
        libasound2-dev:arm64 \
        libdbus-1-dev:arm64 \
        libatk1.0-dev:arm64 \
        libgbm-dev:arm64 \
        libx11-dev:arm64 \
        libxcomposite-dev:arm64 \
        libxdamage-dev:arm64 \
        libxext-dev:arm64 \
        libxfixes-dev:arm64 \
        libxrandr-dev:arm64 \
        libpango1.0-dev:arm64 \
        libcups2-dev:arm64",
]
