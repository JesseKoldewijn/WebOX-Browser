[workspace]
# release-plz manages all crates in this Cargo workspace together.
# It reads conventional commits since the last release, determines the
# next semver bump, updates all Cargo.toml [workspace.package] version
# fields, generates CHANGELOG.md, and opens a release PR.
# When that PR is merged it tags the commit and creates a GitHub Release.

# Changelog is generated by git-cliff using cliff.toml
changelog_config = "cliff.toml"

# Only publish a GitHub Release (no crates.io publishing — this is an app).
# Set to true if you want to publish library crates to crates.io.
publish = false

# git_release_enable must be set explicitly because release-plz defaults it
# to the same value as `publish`. With publish = false it would otherwise
# silently skip creating GitHub Releases entirely.
git_release_enable = true

# Commit message used for the version-bump commit inside the release PR.
# Follows the skip-ci convention so CI doesn't re-run on the bump commit.
git_release_body = "## What's Changed\n\n{{ changelog }}"

[package]
# Apply the same release-plz settings to all workspace members.
# Individual overrides can be added as [[package]] sections.
changelog_include_paths = ["**/*.rs", "**/*.toml", "**/*.md"]
changelog_update = true

# The primary published artifact is the browser app binary.
# Library crates (engine, shell, config, …) are not published to crates.io.
publish = false

# Mirror the workspace-level override so per-package defaults also produce releases.
git_release_enable = true
