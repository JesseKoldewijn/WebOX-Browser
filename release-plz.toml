[workspace]
# release-plz manages all crates in this Cargo workspace together.
# It reads conventional commits since the last release, determines the
# next semver bump, updates all Cargo.toml [workspace.package] version
# fields, generates CHANGELOG.md, and opens a release PR.
# When that PR is merged it tags the commit and creates a GitHub Release.

# Changelog is generated by git-cliff using cliff.toml
changelog_config = "cliff.toml"

# git_only: use git tags to determine the current version instead of
# checking the cargo registry. Required because our packages are not
# published to crates.io; without this release-plz queries crates.io,
# finds no published version, and silently does nothing.
git_only = true

# Do not publish to crates.io (this is an app, not a library crate).
publish = false

# git_release_enable must be set explicitly because release-plz defaults
# it to the same value as `publish`. With publish = false it would
# otherwise silently skip creating GitHub Releases entirely.
git_release_enable = true

# Update CHANGELOG.md for all workspace packages on every release.
changelog_update = true

# Commit message used for the version-bump commit inside the release PR.
git_release_body = "## What's Changed\n\n{{ changelog }}"

# build.rs downloads CEF binaries into third_party/cef/ at build time.
# That directory is gitignored but release-plz sees the downloaded files
# as uncommitted changes and refuses to proceed. allow_dirty lets it
# continue despite the untracked third_party/ contents.
allow_dirty = true

# None of our crates expose a stable public library API, so semver
# breaking-change detection via cargo-semver-checks is not meaningful
# here. Disabling it also avoids the cargo check pass that triggers
# build.rs and causes the third_party/cef/ dirty-tree problem.
semver_check = false
