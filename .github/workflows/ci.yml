name: CI

on:
  push:
    branches: ["**"]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gate: skip release commits and [skip ci] ────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - name: Check skip conditions
        id: skip
        # Pass the commit message via env to avoid bash interpreting
        # backticks / special chars injected by ${{ }} expression syntax.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == chore\(release\):* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: release commit"
          elif [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: [skip ci] in message"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # ── Lint: fmt + clippy (fast, no CEF needed) ────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Build deps only (no binary — much faster, skips CEF download)
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-lint-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Unit + integration tests (linux only — no CEF required for logic tests) ─
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Cache CEF download — keyed on CEF version so it almost never invalidates
      - name: Cache CEF download
        uses: actions/cache@v4
        with:
          path: third_party/cef/
          key: cef-linux-x64-147.0.10
          restore-keys: |
            cef-linux-x64-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-test-

      # Install Linux system deps required to build egui/eframe
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config

      - name: cargo test --workspace
        run: cargo test --workspace
        env:
          # Tests that need CEF will be skipped if CEF is not present;
          # the build.rs download will populate third_party/cef/ from cache or fresh.
          WEBOX_SKIP_CEF_TESTS: "1"
