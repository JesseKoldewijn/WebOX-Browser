name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no push, no release created)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: skip release commits (prevents infinite loops) ─────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
      is_dry_run: ${{ steps.dry.outputs.is_dry_run }}
    steps:
      - name: Check skip conditions
        id: skip
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == chore\(release\):* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: release commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dry run
        id: dry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          fi

  # ── release-plz: opens/updates release PR or publishes release ───────────────
  # release-plz works in two modes:
  #   1. On every push to main: creates/updates a "release PR" that bumps
  #      Cargo.toml versions and updates CHANGELOG.md based on conventional commits.
  #   2. When the release PR is merged: tags the commit and creates a GitHub Release.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_skip != 'true'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.release-plz.outputs.tag }}
      # Strip leading 'v' for use in archive filenames
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        if: needs.setup.outputs.is_dry_run != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-plz
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Debug release-plz outputs
        if: always()
        run: |
          echo "== release-plz step outputs =="
          echo "releases_created: '${{ steps.release-plz.outputs.releases_created }}'"
          echo "prs_created:      '${{ steps.release-plz.outputs.prs_created }}'"
          echo "tag:              '${{ steps.release-plz.outputs.tag }}'"
          echo "pr_number:        '${{ steps.release-plz.outputs.pr_number }}'"
          echo "== all outputs (json) =="
          echo '${{ toJSON(steps.release-plz.outputs) }}'

      - name: Run release-plz (dry run)
        if: needs.setup.outputs.is_dry_run == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          args: --dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.release-plz.outputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ── Build release artifacts (reuses build.yml matrix, no duplication) ─────────
  build-release-artifacts:
    name: Build Release Artifacts
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-plz.outputs.version }}

  # ── Attach versioned binaries to the GitHub Release ───────────────────────────
  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [release-plz, build-release-artifacts]
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webox-browser-*
          merge-multiple: true
          path: dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plz.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
