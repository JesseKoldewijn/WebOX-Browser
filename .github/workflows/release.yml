name: Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - 'release-plz.toml'
      - 'cliff.toml'
      - 'packaging/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no push, no release created)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: skip release commits (prevents infinite loops) ─────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
      is_dry_run: ${{ steps.dry.outputs.is_dry_run }}
    steps:
      - name: Check skip conditions
        id: skip
        # Pass the commit message via env to avoid bash interpreting
        # backticks / special chars injected by ${{ }} expression syntax.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == chore\(release\):* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: release commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dry run
        id: dry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          fi

  # ── release-plz: opens/updates release PR or publishes release ───────────────
  # release-plz works in two modes:
  #   1. On every push to main: creates/updates a "release PR" that bumps
  #      Cargo.toml versions and updates CHANGELOG.md based on conventional commits.
  #   2. When the release PR is merged: tags the commit and creates a GitHub Release.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_skip != 'true'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.version.outputs.tag }}
      # Strip leading 'v' for use in archive filenames
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # git fetch does not overwrite locally-cached force-pushed tags by default.
      # Release-plz reads tags via git2 from the local object db, so without this
      # it would see stale tag→commit mappings and check out the wrong build.rs.
      - name: Force-refresh tags
        run: git fetch --tags --force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache crate downloads so cargo package does not re-fetch deps each run.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-plz-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-plz-registry-

      # Release-plz internally runs `cargo package --allow-dirty --workspace`
      # (no --no-verify flag, no config option to skip it).  The --verify step
      # compiles every packaged crate which:
      #   (a) triggers build.rs → 500 MB CEF download even with SKIP_CEF_DOWNLOAD,
      #       because the tag commit's build.rs might predate that guard, AND
      #   (b) places extracted packages under $CARGO_TARGET_DIR/package/ which is
      #       outside the workspace tree, breaking resolution of inter-workspace
      #       path deps (webox-engine → webox-config → crates.io → not found).
      #
      # Fix: intercept `cargo package` calls via the $CARGO env var and inject
      # --no-verify.  Release-plz only needs the .crate file list, not a compiled
      # binary, so skipping verification is safe and makes the step run in seconds.
      - name: Create cargo wrapper (skip package verification)
        run: |
          cat > /tmp/cargo-no-verify << 'WRAPPER'
          #!/bin/bash
          args=("$@")
          for i in "${!args[@]}"; do
            if [[ "${args[$i]}" == "package" ]]; then
              args=("${args[@]:0:$((i+1))}" "--no-verify" "${args[@]:$((i+1))}")
              break
            fi
          done
          exec "/home/runner/.cargo/bin/cargo" "${args[@]}"
          WRAPPER
          chmod +x /tmp/cargo-no-verify

      - name: Run release-plz
        id: release-plz
        if: needs.setup.outputs.is_dry_run != 'true'
        uses: release-plz/action@v0.5
        # Omit `command` so the action runs both release-pr and release
        # (passing `command: release-plz` is invalid and causes both blocks to be skipped)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Skip the CEF download in build.rs (CEF is loaded at runtime, not linked).
          SKIP_CEF_DOWNLOAD: "1"
          # Use the wrapper above so `cargo package` runs with --no-verify.
          # NOTE: do NOT set CARGO_TARGET_DIR here — when set to an external path it
          # places extracted packages outside the workspace tree, which breaks
          # resolution of inter-workspace path deps during --verify.
          CARGO: /tmp/cargo-no-verify

      - name: Debug release-plz outputs
        if: always()
        run: |
          echo "== release-plz step outputs =="
          echo "releases_created: '${{ steps.release-plz.outputs.releases_created }}'"
          echo "prs_created:      '${{ steps.release-plz.outputs.prs_created }}'"
          echo "pr:               '${{ steps.release-plz.outputs.pr }}'"
          echo "releases (json):  '${{ steps.release-plz.outputs.releases }}'"
          echo "== all outputs (json) =="
          echo '${{ toJSON(steps.release-plz.outputs) }}'

      - name: Run release-plz (dry run)
        if: needs.setup.outputs.is_dry_run == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Extract version from releases JSON
        id: version
        run: |
          # releases output is a JSON array; grab the tag of the first release
          RELEASES='${{ steps.release-plz.outputs.releases }}'
          if [[ -n "$RELEASES" && "$RELEASES" != "null" && "$RELEASES" != "[]" ]]; then
            TAG=$(echo "$RELEASES" | jq -r '.[0].tag // ""')
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ── Build release artifacts (reuses build.yml matrix, no duplication) ─────────
  build-release-artifacts:
    name: Build Release Artifacts
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-plz.outputs.version }}

  # ── Attach versioned binaries to the GitHub Release ───────────────────────────
  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [release-plz, build-release-artifacts]
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webox-browser-*
          merge-multiple: true
          path: dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plz.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
