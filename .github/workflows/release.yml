name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no push, no release created)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: skip release commits (prevents infinite loops) ─────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
      is_dry_run: ${{ steps.dry.outputs.is_dry_run }}
    steps:
      - name: Check skip conditions
        id: skip
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == chore\(release\):* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: release commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dry run
        id: dry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          fi

  # ── release-plz: opens/updates release PR or publishes release ───────────────
  # release-plz works in two modes:
  #   1. On every push to main: creates/updates a "release PR" that bumps
  #      Cargo.toml versions and updates CHANGELOG.md based on conventional commits.
  #   2. When the release PR is merged: tags the commit and creates a GitHub Release.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_skip != 'true'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.release-plz.outputs.tag }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        id: release-plz
        if: needs.setup.outputs.is_dry_run != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-plz
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Run release-plz (dry run)
        if: needs.setup.outputs.is_dry_run == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          args: --dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # ── Build release artifacts when a new version was just published ─────────────
  build-release-artifacts:
    name: Build Release Artifacts
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            cef_cache_key: cef-linux-x64-147.0.10
            sys_deps: >-
              libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libxkbcommon-dev libssl-dev pkg-config
            archive_ext: tar.gz

          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            cef_cache_key: cef-linux-arm64-147.0.10
            sys_deps: ""
            archive_ext: tar.gz

          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            cef_cache_key: cef-macos-arm64-147.0.10
            sys_deps: ""
            archive_ext: tar.gz

          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            cef_cache_key: cef-windows-x64-147.0.10
            sys_deps: ""
            archive_ext: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the tagged commit that release-plz just created
          ref: ${{ needs.release-plz.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install system dependencies
        if: matrix.sys_deps != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.sys_deps }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-

      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: third_party/cef/
          key: ${{ matrix.cef_cache_key }}

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p webox-browser-app

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p webox-browser-app

      - name: Stage artifacts (Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/webox-browser-app staging/

          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  slug="linux-x64" ;;
            aarch64-unknown-linux-gnu) slug="linux-arm64" ;;
            aarch64-apple-darwin)      slug="macos-arm64" ;;
            x86_64-apple-darwin)       slug="macos-x64" ;;
          esac
          [ -d "third_party/cef/$slug" ] && cp -r "third_party/cef/$slug/." staging/

          VERSION="${{ needs.release-plz.outputs.tag }}"
          VERSION="${VERSION#v}"
          tar -czf "webox-browser-${VERSION}-${{ matrix.name }}.tar.gz" -C staging .

      - name: Stage artifacts (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item "target/${{ matrix.target }}/release/webox-browser-app.exe" staging/
          $slug = "windows-x64"
          if (Test-Path "third_party/cef/$slug") {
            Copy-Item "third_party/cef/$slug/*" -Destination staging/ -Recurse -Force
          }
          $ver = "${{ needs.release-plz.outputs.tag }}" -replace '^v', ''
          Compress-Archive -Path staging/* -DestinationPath "webox-browser-${ver}-${{ matrix.name }}.zip"

      - name: Upload release artifact (tar)
        if: matrix.archive_ext == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: "webox-browser-*-${{ matrix.name }}.tar.gz"
          retention-days: 1

      - name: Upload release artifact (zip)
        if: matrix.archive_ext == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: "webox-browser-*-${{ matrix.name }}.zip"
          retention-days: 1

  # ── Attach binaries to the GitHub Release created by release-plz ─────────────
  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [release-plz, build-release-artifacts]
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plz.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
