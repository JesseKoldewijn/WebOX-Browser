name: Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - 'release-plz.toml'
      - 'cliff.toml'
      - 'packaging/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no push, no release created)"
        required: false
        default: false
        type: boolean
      tag:
        description: |
          Existing release tag to backfill with artifacts
          (e.g. webox-browser-app-v0.1.1).
          When set, skips release-plz and goes straight to build → attach.
          Use this to attach binaries to a release that was created without them.
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: skip release commits + detect run mode ──────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
      is_dry_run:  ${{ steps.dry.outputs.is_dry_run }}
      is_backfill: ${{ steps.backfill.outputs.is_backfill }}
    steps:
      - name: Check skip conditions
        id: skip
        # Pass the commit message via env to avoid bash interpreting
        # backticks / special chars injected by ${{ }} expression syntax.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == chore\(release\):* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: release commit"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dry run
        id: dry
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "is_dry_run=true" >> $GITHUB_OUTPUT
          else
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Check backfill mode
        id: backfill
        run: |
          # Backfill mode is active when a tag is provided via workflow_dispatch.
          # In this mode we skip release-plz entirely and go straight to
          # build → attach for the specified existing GitHub Release tag.
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "is_backfill=true" >> $GITHUB_OUTPUT
            echo "Backfill mode: tag=${{ inputs.tag }}"
          else
            echo "is_backfill=false" >> $GITHUB_OUTPUT
          fi

  # ══════════════════════════════════════════════════════════════════════════════
  # ── BACKFILL PATH ─────────────────────────────────────────────────────────────
  # Used via workflow_dispatch with a non-empty `tag` input to attach binaries
  # to an already-created GitHub Release (e.g. v0.1.0, v0.1.1) that is missing
  # its build artifacts.
  # ══════════════════════════════════════════════════════════════════════════════

  # ── Parse tag → semver ────────────────────────────────────────────────────────
  backfill-setup:
    name: Backfill Setup
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.is_backfill == 'true'
    outputs:
      tag:     ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag and version
        id: parse
        run: |
          TAG="${{ inputs.tag }}"
          # Strip any prefix (e.g. "webox-browser-app-v") to get plain semver.
          VERSION=$(echo "$TAG" | grep -oP '\d+\.\d+\.\d+.*' || true)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not extract semver from tag: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Backfilling: tag=${TAG}  version=${VERSION}"

  # ── Build for the backfill tag ────────────────────────────────────────────────
  backfill-build:
    name: Backfill Build
    needs: backfill-setup
    # Only run when backfill-setup actually succeeded (not just skipped).
    if: needs.backfill-setup.result == 'success'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.backfill-setup.outputs.version }}

  # ── Attach artifacts to the existing GitHub Release ───────────────────────────
  backfill-attach:
    name: Backfill — Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [backfill-setup, backfill-build]
    if: needs.backfill-setup.result == 'success' && needs.backfill-build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webox-browser-*
          merge-multiple: true
          path: dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.backfill-setup.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false

  # ══════════════════════════════════════════════════════════════════════════════
  # ── NORMAL RELEASE PATH (release-plz driven) ──────────────────────────────────
  # ══════════════════════════════════════════════════════════════════════════════

  # ── release-plz: opens/updates release PR or publishes release ───────────────
  # release-plz works in two modes:
  #   1. On every push to main: creates/updates a "release PR" that bumps
  #      Cargo.toml versions and updates CHANGELOG.md based on conventional commits.
  #   2. When the release PR is merged: tags the commit and creates a GitHub Release.
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    needs: setup
    # Skip when: it's a release commit (loop guard), OR we're in backfill mode.
    if: |
      needs.setup.outputs.should_skip != 'true' &&
      needs.setup.outputs.is_backfill != 'true'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.version.outputs.tag }}
      # Strip leading 'v' for use in archive filenames
      version: ${{ steps.version.outputs.version }}
      # True only when the app crate itself was released (not just lib crates)
      app_released: ${{ steps.version.outputs.app_released }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # git fetch does not overwrite locally-cached force-pushed tags by default.
      # Release-plz reads tags via git2 from the local object db, so without this
      # it would see stale tag→commit mappings and check out the wrong build.rs.
      - name: Force-refresh tags
        run: git fetch --tags --force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache crate downloads so cargo package does not re-fetch deps each run.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-plz-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-plz-registry-

      - name: Run release-plz
        id: release-plz
        if: needs.setup.outputs.is_dry_run != 'true'
        uses: release-plz/action@v0.5
        # Omit `command` so the action runs both release-pr and release
        # (passing `command: release-plz` is invalid and causes both blocks to be skipped)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Skip the CEF download in build.rs (CEF is loaded at runtime, not linked).
          # release-plz runs `cargo package --verify` in a temp git worktree; without
          # this flag build.rs would trigger a 500 MB CEF download on every run.
          # The guard is in apps/browser/build.rs — it returns Ok(()) immediately when
          # this env var is set, so the crate still compiles and links correctly.
          #
          # Do NOT set CARGO_TARGET_DIR here.  When pointed at an external path it
          # moves the extracted package outside the workspace tree, which breaks
          # relative path deps (e.g. webox-engine → "../../crates/config").  With the
          # default target dir the extraction lands inside the temp worktree and the
          # relative paths resolve correctly.
          SKIP_CEF_DOWNLOAD: "1"

      - name: Debug release-plz outputs
        if: always()
        run: |
          echo "== release-plz step outputs =="
          echo "releases_created: '${{ steps.release-plz.outputs.releases_created }}'"
          echo "prs_created:      '${{ steps.release-plz.outputs.prs_created }}'"
          echo "pr:               '${{ steps.release-plz.outputs.pr }}'"
          echo "releases (json):  '${{ steps.release-plz.outputs.releases }}'"
          echo "== all outputs (json) =="
          echo '${{ toJSON(steps.release-plz.outputs) }}'

      - name: Run release-plz (dry run)
        if: needs.setup.outputs.is_dry_run == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Extract version from releases JSON
        id: version
        run: |
          # releases output is a JSON array of objects with {package_name, tag, version, …}.
          # With git_release_enable=true only for webox-browser-app the array will only
          # ever contain that one entry when a GitHub Release was created, but we filter
          # explicitly by package name to be safe.
          RELEASES='${{ steps.release-plz.outputs.releases }}'
          if [[ -n "$RELEASES" && "$RELEASES" != "null" && "$RELEASES" != "[]" ]]; then
            # Prefer the app package entry; fall back to first entry if absent.
            TAG=$(echo "$RELEASES" | jq -r '
              (map(select(.package_name == "webox-browser-app")) | .[0].tag) //
              .[0].tag //
              ""
            ')
            APP_RELEASED=$(echo "$RELEASES" | jq -r '
              if (map(select(.package_name == "webox-browser-app")) | length) > 0
              then "true" else "false" end
            ')
          else
            TAG=""
            APP_RELEASED="false"
          fi
          # Extract semver from tag — handles both plain "v0.1.0" and
          # prefixed "webox-browser-app-v0.1.0" formats.
          VERSION=$(echo "$TAG" | grep -oP '\d+\.\d+\.\d+.*' || true)
          echo "tag=${TAG}"          >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "app_released=${APP_RELEASED}" >> "$GITHUB_OUTPUT"

  # ── Build release artifacts (reuses build.yml matrix, no duplication) ─────────
  build-release-artifacts:
    name: Build Release Artifacts
    needs: release-plz
    if: needs.release-plz.outputs.app_released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-plz.outputs.version }}

  # ── Attach versioned binaries to the GitHub Release ───────────────────────────
  attach-to-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [release-plz, build-release-artifacts]
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: webox-browser-*
          merge-multiple: true
          path: dist/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-plz.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
