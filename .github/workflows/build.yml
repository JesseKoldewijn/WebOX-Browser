name: Build

on:
  push:
    branches: [main]
    paths:
      # Rust source & workspace members
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      # Cargo manifests and lockfile (catch-all for any Cargo.toml in the tree)
      - '**/Cargo.toml'
      - 'Cargo.lock'
      # Build scripts anywhere in the tree
      - '**/build.rs'
      # Rust / Cargo config files
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      # Packaging templates affect installer outputs
      - 'packaging/**'
      # This workflow file itself
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - 'packaging/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # Also callable from release.yml to produce release artifacts
  workflow_call:
    inputs:
      upload_artifacts:
        description: "Upload build artifacts for release"
        type: boolean
        default: false
      version:
        description: "Version string to embed in archive/installer filenames (e.g. '1.2.3'). Omit for unversioned snapshot builds."
        type: string
        default: ""
    outputs:
      artifact_names:
        description: "Comma-separated list of artifact names"
        value: ${{ jobs.collect.outputs.artifact_names }}

concurrency:
  # Use event_name so a direct push-triggered run and a workflow_call-triggered
  # run (from release.yml) get distinct concurrency slots and never cancel each
  # other. Without this, the release build can be silently cancelled by a
  # concurrent CI push build that shares the same ref.
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Matrix build across all supported platforms ──────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (native) ──────────────────────────────────────────
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            cef_cache_key: cef-linux-x64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: >-
              libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libxkbcommon-dev libssl-dev pkg-config
            artifact_ext: ""
            archive_cmd: tar
            deb_arch: amd64
            build_appimage: true
            build_dmg: false
            build_msi: false

          # ── Linux aarch64 (cross-compiled via `cross`) ────────────────────
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            cef_cache_key: cef-linux-arm64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ""
            archive_cmd: tar
            deb_arch: arm64
            build_appimage: false
            build_dmg: false
            build_msi: false

          # ── macOS ARM64 (Apple Silicon, native) ───────────────────────────
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            cef_cache_key: cef-macos-arm64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ""
            archive_cmd: tar
            deb_arch: ""
            build_appimage: false
            build_dmg: true
            build_msi: false

          # ── Windows x86_64 (native MSVC) ──────────────────────────────────
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            cef_cache_key: cef-windows-x64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ".exe"
            archive_cmd: zip
            deb_arch: ""
            build_appimage: false
            build_dmg: false
            build_msi: true

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install `cross` for cross-compilation targets
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install system dependencies (Linux native)
        if: matrix.sys_deps != '' && !matrix.use_cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.sys_deps }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      # CEF binaries are large (~500MB) and version-pinned. Cache keyed on version
      # so it almost never invalidates between commits.
      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cef_cache_path }}
          key: ${{ matrix.cef_cache_key }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.target }}-build-

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p webox-browser-app

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p webox-browser-app

      # ── Stage artifact ──────────────────────────────────────────────────────
      - name: Create staging directory
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/webox-browser-app${{ matrix.artifact_ext }} staging/

      - name: Copy CEF runtime into staging (Linux/macOS)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  slug="linux-x64" ;;
            aarch64-unknown-linux-gnu) slug="linux-arm64" ;;
            aarch64-apple-darwin)      slug="macos-arm64" ;;
            x86_64-apple-darwin)       slug="macos-x64" ;;
          esac
          cef_dir="third_party/cef/$slug"
          # cargo build runs build.rs which downloads and stages CEF into this
          # directory. If it is absent something went wrong upstream — fail loudly
          # rather than silently shipping an archive with no CEF runtime.
          if [ ! -d "$cef_dir" ]; then
            echo "::error::CEF staging directory missing: $cef_dir"
            echo "::error::cargo build should have populated it via build.rs."
            exit 1
          fi
          cp -r "$cef_dir/." staging/

      - name: Copy CEF runtime into staging (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          $slug = "windows-x64"
          $cef_dir = "third_party/cef/$slug"
          if (-not (Test-Path $cef_dir)) {
            Write-Error "CEF staging directory missing: $cef_dir — cargo build should have populated it via build.rs."
            exit 1
          }
          Copy-Item "$cef_dir/*" -Destination staging/ -Recurse -Force

      # ── Archive ─────────────────────────────────────────────────────────────
      - name: Create tar.gz archive (Linux/macOS)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            ARCHIVE="webox-browser-${VERSION}-${{ matrix.name }}.tar.gz"
          else
            ARCHIVE="webox-browser-${{ matrix.name }}.tar.gz"
          fi
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify CEF present in archive (Linux/macOS)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          # Write the archive listing to a temp file before grepping.
          # grep -q exits as soon as it finds a match, sending SIGPIPE to tar.
          # With pipefail enabled that non-zero tar exit becomes the pipeline
          # result, producing a false "missing" failure even when libcef is
          # present. A temp file avoids the pipe entirely.
          tmplist=$(mktemp)
          tar -tzf "$ARCHIVE" > "$tmplist"

          # Platform-specific primary CEF library path pattern:
          #   Linux: flat libcef.so alongside the binary
          #   macOS: Chromium Embedded Framework bundle (no .dylib on the main binary)
          case "${{ matrix.target }}" in
            *-linux-*)  cef_pattern='libcef\.so' ;;
            *-apple-*)  cef_pattern='Chromium Embedded Framework\.framework' ;;
          esac

          if ! grep -qE "$cef_pattern" "$tmplist"; then
            echo "::error::Primary CEF library missing from $ARCHIVE (pattern: $cef_pattern)"
            echo "::error::Archive contents (first 40 entries):"
            head -40 "$tmplist"
            rm "$tmplist"
            exit 1
          fi
          echo "CEF verified in archive: $(grep -E "$cef_pattern" "$tmplist" | head -1)"
          rm "$tmplist"

      - name: Create zip archive (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version) {
            $archive = "webox-browser-${version}-${{ matrix.name }}.zip"
          } else {
            $archive = "webox-browser-${{ matrix.name }}.zip"
          }
          Compress-Archive -Path staging/* -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify CEF present in archive (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          # Fail the build if core Windows CEF runtime assets are missing.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($env:ARCHIVE)
          $entryNames = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()

          $requiredPatterns = @(
            '(^|/)libcef\.dll$',
            '(^|/)icudtl\.dat$',
            '(^|/)resources\.pak$',
            '(^|/)locales/'
          )

          foreach ($pattern in $requiredPatterns) {
            if (-not ($entryNames | Where-Object { $_ -match $pattern })) {
              Write-Error "Required Windows CEF asset missing from $env:ARCHIVE (pattern: $pattern)"
              exit 1
            }
          }

          foreach ($dir in @('swiftshader/', 'vk_swiftshader/')) {
            if (-not ($entryNames | Where-Object { $_ -like "*$dir*" })) {
              Write-Error "Missing nested runtime directory: $dir"
              exit 1
            }
            Write-Host "Verified nested runtime directory in archive: $dir"
          }

          Write-Host "CEF verified in archive: libcef.dll, icudtl.dat, resources.pak, locales/"

      # ── Upload archive ────────────────────────────────────────────────────────
      - name: Upload archive artifact (tar)
        if: matrix.archive_cmd == 'tar'
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

      - name: Upload archive artifact (zip)
        if: matrix.archive_cmd == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

      # ══════════════════════════════════════════════════════════════════════════
      # ── Native installers ─────────────────────────────────────────────────────
      # ══════════════════════════════════════════════════════════════════════════

      # ── .deb (Linux x64 + arm64) ──────────────────────────────────────────────
      - name: Build .deb package (Linux)
        if: matrix.deb_arch != ''
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0~snapshot"; fi
          ARCH="${{ matrix.deb_arch }}"
          DEB_ROOT="deb-build"

          mkdir -p "${DEB_ROOT}/DEBIAN"
          mkdir -p "${DEB_ROOT}/usr/lib/webox-browser"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/usr/share/applications"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps"

          # Binary + CEF runtime into /usr/lib/webox-browser/
          cp -r staging/. "${DEB_ROOT}/usr/lib/webox-browser/"
          chmod 755 "${DEB_ROOT}/usr/lib/webox-browser/webox-browser-app"

          # Symlink binary into /usr/bin/
          ln -sf /usr/lib/webox-browser/webox-browser-app \
                 "${DEB_ROOT}/usr/bin/webox-browser"

          # Desktop entry and icon
          cp packaging/appimage/webox-browser.desktop \
             "${DEB_ROOT}/usr/share/applications/"
          cp packaging/icon.png \
             "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/webox-browser.png"

          # Generate control file (inject version, arch, installed-size)
          INSTALLED_KB=$(du -sk "${DEB_ROOT}/usr" | cut -f1)
          sed "s/VERSION/${VERSION}/g; s/ARCH/${ARCH}/g; s/INSTALLED_SIZE/${INSTALLED_KB}/g" \
              packaging/deb/control.template > "${DEB_ROOT}/DEBIAN/control"

          # Post-install script
          cp packaging/deb/postinst "${DEB_ROOT}/DEBIAN/postinst"
          chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

          DEB_FILE="webox-browser-${VERSION}-${{ matrix.name }}.deb"
          dpkg-deb --build --root-owner-group "${DEB_ROOT}" "${DEB_FILE}"
          echo "DEB_FILE=${DEB_FILE}" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        if: matrix.deb_arch != '' && env.DEB_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}-deb
          path: ${{ env.DEB_FILE }}
          retention-days: 7

      # ── AppImage (Linux x64 only) ──────────────────────────────────────────────
      - name: Build AppImage (Linux x64)
        if: matrix.build_appimage == true
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0-snapshot"; fi

          APPDIR="AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib/webox-browser"
          mkdir -p "${APPDIR}/usr/share/applications"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          # Copy CEF runtime into the lib dir and binary into usr/bin/
          cp -r staging/. "${APPDIR}/usr/lib/webox-browser/"
          mv "${APPDIR}/usr/lib/webox-browser/webox-browser-app" \
             "${APPDIR}/usr/bin/webox-browser-app"
          chmod 755 "${APPDIR}/usr/bin/webox-browser-app"

          # AppImage requires the .desktop file and icon at the AppDir root
          cp packaging/appimage/webox-browser.desktop "${APPDIR}/"
          cp packaging/appimage/webox-browser.desktop \
             "${APPDIR}/usr/share/applications/"
          cp packaging/icon.png \
             "${APPDIR}/usr/share/icons/hicolor/256x256/apps/webox-browser.png"
          # AppImage also expects icon at root (without extension)
          cp packaging/icon.png "${APPDIR}/webox-browser.png"

          # AppRun entry point
          cp packaging/appimage/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          # Download appimagetool; use APPIMAGE_EXTRACT_AND_RUN=1 to avoid
          # needing FUSE on the GitHub Actions runner
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -O appimagetool
          chmod +x appimagetool

          APPIMAGE_FILE="webox-browser-${VERSION}-linux-x64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream \
              "${APPDIR}" "${APPIMAGE_FILE}"
          echo "APPIMAGE_FILE=${APPIMAGE_FILE}" >> "$GITHUB_ENV"

      - name: Upload AppImage artifact
        if: matrix.build_appimage == true && env.APPIMAGE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-linux-x64-appimage
          path: ${{ env.APPIMAGE_FILE }}
          retention-days: 7

      # ── PKGBUILD (Linux x64 — generated from template, validated in Docker) ──
      - name: Generate and validate PKGBUILD (Linux x64)
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi

          # Compute SHA256 of the tarball we just built
          TARBALL="${{ env.ARCHIVE }}"
          SHA256=$(sha256sum "${TARBALL}" | awk '{print $1}')

          # Substitute placeholders in the template
          sed "s/VERSION/${VERSION}/g; s/SHA256_TARBALL/${SHA256}/g" \
              packaging/arch/PKGBUILD.template > PKGBUILD

          # Validate: source the PKGBUILD and check required variables are set
          bash -c 'source PKGBUILD && \
            [ -n "$pkgname" ] && [ -n "$pkgver" ] && [ -n "$pkgrel" ] && \
            echo "PKGBUILD OK: pkgname=$pkgname pkgver=$pkgver"'

          # Generate .SRCINFO using Arch Linux Docker image
          # (makepkg --printsrcinfo is the authoritative SRCINFO generator)
          docker run --rm \
            -v "$PWD:/pkg" \
            -w /pkg \
            archlinux/archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm --needed base-devel 2>/dev/null
              useradd -m builder
              chown builder /pkg
              su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'
            "

          echo "PKGBUILD_READY=true" >> "$GITHUB_ENV"

      - name: Upload PKGBUILD + .SRCINFO artifacts
        if: matrix.name == 'linux-x64' && env.PKGBUILD_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-linux-x64-pkgbuild
          path: |
            PKGBUILD
            .SRCINFO
          retention-days: 7

      # ── .dmg (macOS arm64) ────────────────────────────────────────────────────
      - name: Build .dmg (macOS)
        if: matrix.build_dmg == true
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0-snapshot"; fi

          APP_BUNDLE="WeboxBrowser.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"

          # Binary + CEF runtime all live alongside each other in Contents/MacOS/
          # (build.rs sets @rpath to @executable_path so dylibs resolve correctly)
          cp -r staging/. "${APP_BUNDLE}/Contents/MacOS/"
          chmod 755 "${APP_BUNDLE}/Contents/MacOS/webox-browser-app"

          # Info.plist (inject version)
          sed "s/VERSION/${VERSION}/g" packaging/macos/Info.plist.template \
              > "${APP_BUNDLE}/Contents/Info.plist"

          # Convert PNG icon → .icns using sips + iconutil (both pre-installed on macOS runners)
          mkdir -p AppIcon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z ${size} ${size} packaging/icon.png \
                --out "AppIcon.iconset/icon_${size}x${size}.png" 2>/dev/null || true
          done
          # @2x variants for retina
          for size in 16 32 64 128 256; do
            double=$((size * 2))
            sips -z ${double} ${double} packaging/icon.png \
                --out "AppIcon.iconset/icon_${size}x${size}@2x.png" 2>/dev/null || true
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns || true
          if [ -f AppIcon.icns ]; then
            cp AppIcon.icns "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"
          fi

          DMG_FILE="webox-browser-${VERSION}-${{ matrix.name }}.dmg"

          # Create a read/write image, copy .app in, then convert to compressed UDZO
          hdiutil create -size 2g -fs HFS+ -volname "WebOX Browser" \
              -o "rw_tmp.dmg" 2>/dev/null
          hdiutil attach rw_tmp.dmg -mountpoint /Volumes/WebOXBrowser
          cp -r "${APP_BUNDLE}" /Volumes/WebOXBrowser/
          # Add a symlink to /Applications for drag-install UX
          ln -s /Applications /Volumes/WebOXBrowser/Applications
          hdiutil detach /Volumes/WebOXBrowser
          hdiutil convert rw_tmp.dmg -format UDZO -o "${DMG_FILE}"
          rm rw_tmp.dmg

          echo "DMG_FILE=${DMG_FILE}" >> "$GITHUB_ENV"

      - name: Upload .dmg artifact
        if: matrix.build_dmg == true && env.DMG_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}-dmg
          path: ${{ env.DMG_FILE }}
          retention-days: 7

      # ── .msi (Windows x64) ────────────────────────────────────────────────────
      - name: Build .msi (Windows)
        if: matrix.build_msi == true
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "0.0.0" }

          # ── Install WiX v7 (pass -acceptEula wix7 on each command for CI) ──
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext -acceptEula wix7 --global

          # ── Harvest staging\ into AppFiles.wxs ─────────────────────────────
          # WiX v4 wix harvest is used if available; otherwise we generate
          # the fragment with PowerShell to guarantee correctness.
          $stagingPath = (Resolve-Path "staging").Path
          $appFilesWxs = "AppFiles.wxs"

          function New-WixId([string]$Prefix, [string]$RelativePath) {
            $normalized = $RelativePath -replace '[\\/\.-]', '_'
            return "$Prefix$normalized"
          }

          function Add-WixDirectoryTree {
            param(
              [System.Text.StringBuilder]$Builder,
              [string]$BasePath,
              [System.IO.DirectoryInfo]$Directory,
              [string]$ParentId,
              [hashtable]$DirectoryMap,
              [System.Collections.Generic.List[string]]$DirectoryOrder
            )

            $relativePath = [System.IO.Path]::GetRelativePath($BasePath, $Directory.FullName)
            $dirId = New-WixId -Prefix 'dir_' -RelativePath $relativePath
            $DirectoryMap[$relativePath] = $dirId
            $DirectoryOrder.Add($relativePath) | Out-Null
            $null = $Builder.AppendLine("    <DirectoryRef Id=""$ParentId"">")
            $null = $Builder.AppendLine("      <Directory Id=""$dirId"" Name=""$($Directory.Name)"" />")
            $null = $Builder.AppendLine('    </DirectoryRef>')

            Get-ChildItem -Path $Directory.FullName -Directory | ForEach-Object {
              Add-WixDirectoryTree -Builder $Builder -BasePath $BasePath -Directory $_ -ParentId $dirId -DirectoryMap $DirectoryMap -DirectoryOrder $DirectoryOrder
            }
          }

          $sb = [System.Text.StringBuilder]::new()
          $null = $sb.AppendLine('<?xml version="1.0" encoding="UTF-8"?>')
          $null = $sb.AppendLine('<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">')
          $null = $sb.AppendLine('  <Fragment>')

          $directoryMap = @{}
          $directoryOrder = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path $stagingPath -Directory | ForEach-Object {
            Add-WixDirectoryTree -Builder $sb -BasePath $stagingPath -Directory $_ -ParentId 'INSTALLFOLDER' -DirectoryMap $directoryMap -DirectoryOrder $directoryOrder
          }

          # Top-level files component group
          $null = $sb.AppendLine('    <ComponentGroup Id="AppFiles" Directory="INSTALLFOLDER">')
          Get-ChildItem -Path $stagingPath -File | ForEach-Object {
            $fid = New-WixId -Prefix 'f_' -RelativePath $_.Name
            $null = $sb.AppendLine("      <Component>")
            $null = $sb.AppendLine("        <File Id=""$fid"" Source=""staging\$($_.Name)"" />")
            $null = $sb.AppendLine("      </Component>")
          }
          $null = $sb.AppendLine('    </ComponentGroup>')

          # Subdirectory component groups
          foreach ($relativeDir in $directoryOrder) {
            $dirId = $directoryMap[$relativeDir]
            $cgId  = New-WixId -Prefix 'AppFiles_' -RelativePath $relativeDir
            $relativeDirWindows = $relativeDir -replace '/', '\\'
            $null = $sb.AppendLine("    <ComponentGroup Id=""$cgId"" Directory=""$dirId"">")
            Get-ChildItem -Path (Join-Path $stagingPath $relativeDirWindows) -File | ForEach-Object {
              $relativeFile = [System.IO.Path]::GetRelativePath($stagingPath, $_.FullName)
              $relativeFileWindows = $relativeFile -replace '/', '\\'
              $fid = New-WixId -Prefix 'f_' -RelativePath $relativeFile
              $null = $sb.AppendLine("      <Component>")
              $null = $sb.AppendLine("        <File Id=""$fid"" Source=""staging\$relativeFileWindows"" />")
              $null = $sb.AppendLine("      </Component>")
            }
            $null = $sb.AppendLine('    </ComponentGroup>')
          }

          $null = $sb.AppendLine('  </Fragment>')
          $null = $sb.AppendLine('</Wix>')
          $sb.ToString() | Out-File -FilePath $appFilesWxs -Encoding utf8NoBOM

          # Also generate a feature-ref fragment for subdirectory component groups
          $extraRefs = ""
          foreach ($relativeDir in $directoryOrder) {
            $cgId = New-WixId -Prefix 'AppFiles_' -RelativePath $relativeDir
            $extraRefs += "      <ComponentGroupRef Id=""$cgId"" />`n"
          }

          $generatedWxs = $sb.ToString()
          foreach ($requiredDir in @('locales', 'swiftshader')) {
            $requiredId = New-WixId -Prefix 'AppFiles_' -RelativePath $requiredDir
            if (-not ($generatedWxs -match [regex]::Escape($requiredId))) {
              Write-Error "Harvested MSI manifest is missing nested runtime directory mapping for: $requiredDir"
              exit 1
            }
          }

          # Patch webox-browser.wxs to inject subdirectory refs into the Feature
          $wxsContent = Get-Content packaging/windows/webox-browser.wxs -Raw
          if ($extraRefs -and -not ($wxsContent -match 'AppFiles_')) {
            $wxsContent = $wxsContent -replace `
              '(<ComponentGroupRef Id="AppFiles" />)', `
              "`$1`n$extraRefs"
            $wxsContent | Out-File -FilePath packaging/windows/webox-browser.wxs `
                           -Encoding utf8NoBOM
          }

          # ── Build the MSI ───────────────────────────────────────────────────
          $msiFile = "webox-browser-${version}-windows-x64.msi"
          wix build packaging/windows/webox-browser.wxs $appFilesWxs `
              -d "Version=$version" `
              -ext WixToolset.UI.wixext `
              -acceptEula wix7 `
              -o $msiFile

          "MSI_FILE=$msiFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload .msi artifact
        if: matrix.build_msi == true && env.MSI_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-windows-x64-msi
          path: ${{ env.MSI_FILE }}
          retention-days: 7

  # ── Collect outputs for callers ──────────────────────────────────────────────
  collect:
    name: Collect artifact names
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact_names: >-
        webox-browser-linux-x64,webox-browser-linux-arm64,webox-browser-macos-arm64,webox-browser-windows-x64,webox-browser-linux-x64-deb,webox-browser-linux-arm64-deb,webox-browser-linux-x64-appimage,webox-browser-linux-x64-pkgbuild,webox-browser-macos-arm64-dmg,webox-browser-windows-x64-msi
    steps:
      - run: echo "All builds and installers complete"
