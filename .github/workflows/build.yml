name: Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/browser/**'
      - 'crates/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'Cross.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # Also callable from release.yml to produce release artifacts
  workflow_call:
    inputs:
      upload_artifacts:
        description: "Upload build artifacts for release"
        type: boolean
        default: false
      version:
        description: "Version string to embed in archive filenames (e.g. '1.2.3'). Omit for unversioned snapshot builds."
        type: string
        default: ""
    outputs:
      artifact_names:
        description: "Comma-separated list of artifact names"
        value: ${{ jobs.collect.outputs.artifact_names }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Matrix build across all supported platforms ──────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (native) ──────────────────────────────────────────
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            cef_cache_key: cef-linux-x64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: >-
              libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libxkbcommon-dev libssl-dev pkg-config
            artifact_ext: ""
            archive_cmd: tar

          # ── Linux aarch64 (cross-compiled via `cross`) ────────────────────
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            cef_cache_key: cef-linux-arm64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ""
            archive_cmd: tar

          # ── macOS ARM64 (Apple Silicon, native) ───────────────────────────
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            cef_cache_key: cef-macos-arm64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ""
            archive_cmd: tar

          # ── Windows x86_64 (native MSVC) ──────────────────────────────────
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            cef_cache_key: cef-windows-x64-147.0.10
            cef_cache_path: third_party/cef/
            sys_deps: ""
            artifact_ext: ".exe"
            archive_cmd: zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install `cross` for cross-compilation targets
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install system dependencies (Linux native)
        if: matrix.sys_deps != '' && !matrix.use_cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.sys_deps }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      # CEF binaries are large (~500MB) and version-pinned. Cache keyed on version
      # so it almost never invalidates between commits.
      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cef_cache_path }}
          key: ${{ matrix.cef_cache_key }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.target }}-build-

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p webox-browser-app

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p webox-browser-app

      # ── Stage artifact ──────────────────────────────────────────────────────
      - name: Create staging directory
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/webox-browser-app${{ matrix.artifact_ext }} staging/

      - name: Copy CEF runtime into staging (Linux/macOS)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          # Determine the platform slug from the target
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  slug="linux-x64" ;;
            aarch64-unknown-linux-gnu) slug="linux-arm64" ;;
            aarch64-apple-darwin)      slug="macos-arm64" ;;
            x86_64-apple-darwin)       slug="macos-x64" ;;
          esac
          if [ -d "third_party/cef/$slug" ]; then
            cp -r "third_party/cef/$slug/." staging/
          fi

      - name: Copy CEF runtime into staging (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          $slug = "windows-x64"
          $cef_dir = "third_party/cef/$slug"
          if (Test-Path $cef_dir) {
            Copy-Item "$cef_dir/*" -Destination staging/ -Recurse -Force
          }

      # ── Archive ─────────────────────────────────────────────────────────────
      - name: Create tar.gz archive (Linux/macOS)
        if: matrix.archive_cmd == 'tar'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            ARCHIVE="webox-browser-${VERSION}-${{ matrix.name }}.tar.gz"
          else
            ARCHIVE="webox-browser-${{ matrix.name }}.tar.gz"
          fi
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create zip archive (Windows)
        if: matrix.archive_cmd == 'zip'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version) {
            $archive = "webox-browser-${version}-${{ matrix.name }}.zip"
          } else {
            $archive = "webox-browser-${{ matrix.name }}.zip"
          }
          Compress-Archive -Path staging/* -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Upload ───────────────────────────────────────────────────────────────
      - name: Upload build artifact (tar)
        if: matrix.archive_cmd == 'tar'
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

      - name: Upload build artifact (zip)
        if: matrix.archive_cmd == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: webox-browser-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # ── Collect outputs for callers ──────────────────────────────────────────────
  collect:
    name: Collect artifact names
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact_names: >-
        webox-browser-linux-x64,webox-browser-linux-arm64,webox-browser-macos-arm64,webox-browser-windows-x64
    steps:
      - run: echo "All builds complete"
