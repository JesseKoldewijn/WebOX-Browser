name: Docs

on:
  push:
    branches: ["**"]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: ["**"]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type-check + lint ────────────────────────────────────────────────────────
  check:
    name: Check (astro check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: astro check
        run: bun run check
        working-directory: apps/docs

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build (astro build)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: astro build
        run: bun run build
        working-directory: apps/docs
