[package]
name = "webox-browser-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
eframe = { version = "0.34.1", default-features = true, features = ["wgpu", "x11", "wayland"] }
egui_extras = "0.34.1"
webox-config = { path = "../../crates/config", version = "0.1.1" }
webox-memory = { path = "../../crates/memory", version = "0.1.1" }
webox-shell  = { path = "../../crates/shell", version = "0.1.1" }
webox-ui     = { path = "../../crates/ui", version = "0.1.1" }

[build-dependencies]
# Used in build.rs to download and stage CEF runtime assets into third_party/cef/
# and to copy them next to the binary for portable $ORIGIN-relative loading.
download-cef = "2.3.1"
anyhow = "1"
