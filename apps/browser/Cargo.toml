[package]
name = "webox-browser-app"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
eframe = { version = "0.34.1", default-features = true, features = ["wgpu", "x11", "wayland"] }
egui_extras = "0.34.1"
webox-config = { workspace = true }
webox-memory = { workspace = true }
webox-shell = { workspace = true }
webox-ui = { workspace = true }

[build-dependencies]
# Used in build.rs to download and stage CEF runtime assets into third_party/cef/
# and to copy them next to the binary for portable $ORIGIN-relative loading.
download-cef = "2.3.1"
anyhow = "1"
